# Builds the iOS native shell on a GitHub-hosted macOS runner.
#
# Trigger: manual ("workflow_dispatch") so you don't burn macOS minutes on
# every commit. Run from the Actions tab once you're ready to produce a build.
#
# What it does:
#   1. Checks out the repo on macOS.
#   2. Installs Capacitor + adds the iOS platform (creates ios/ folder).
#   3. Builds an unsigned .app bundle for the Simulator (free, no Apple ID).
#   4. Uploads the build as a workflow artifact you can download + install
#      via Xcode → Devices & Simulators on a Mac.
#
# Once you're a paid Apple Developer Program member, switch this to a signed
# archive that uploads directly to App Store Connect / TestFlight. Stub at
# the bottom of this file shows what to add.

name: Build iOS app

on:
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Add iOS platform
        run: |
          npx cap add ios || echo "ios already added"
          npx cap sync ios

      - name: Build for Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload .app bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacepost-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14

